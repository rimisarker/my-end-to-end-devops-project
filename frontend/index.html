<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps 3-Tier App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .box { background: white; padding: 20px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Welcome to End-to-End DevOps Project</h1>
        <p>Status from Backend: <strong id="status">Loading...</strong></p>
        <button onclick="fetchStatus()">Check Connection</button>
    </div>
    <script>
        function fetchStatus() {
            // /api/status এ হিট করবে, যা Nginx প্রক্সি হয়ে ব্যাকএন্ডে যাবে
            fetch('/api/status')
                .then(res => res.json())
                .then(data => document.getElementById('status').innerText = data.message)
                .catch(err => document.getElementById('status').innerText = "Backend Unreachable!");
        }
        window.onload = fetchStatus;
    </script>
</body>
</html>
